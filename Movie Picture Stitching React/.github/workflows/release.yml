name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Validate release
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test:coverage

  # Build and release
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Package plugin
        run: |
          # Create release package directory
          mkdir -p release

          # Copy build output
          cp -r dist/* release/

          # Copy manifest.json
          cp manifest.json release/

          # Copy locales
          cp -r _locales release/

          # Copy public assets (logo, etc.)
          if [ -d "public" ]; then
            cp -r public/* release/ 2>/dev/null || true
          fi

          # Transform manifest paths for deployment
          node -e "
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('release/manifest.json', 'utf8'));
            
            // Transform main.url: 'dist/index.html' -> 'index.html'
            if (manifest.main?.url) {
              manifest.main.url = manifest.main.url.replace('dist/', '');
            }
            
            // Transform logo: 'public/logo.png' -> 'logo.png'
            if (manifest.logo) {
              manifest.logo = manifest.logo.replace('public/', '');
            }
            
            fs.writeFileSync('release/manifest.json', JSON.stringify(manifest, null, 2));
            console.log('✅ Manifest paths transformed');
          "

          # Create zip archive
          cd release && zip -r ../eagle-react-template-${{ github.ref_name }}.zip .

          echo "📦 Release package created: eagle-react-template-${{ github.ref_name }}.zip"
          ls -la ../eagle-react-template-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: eagle-react-template-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
