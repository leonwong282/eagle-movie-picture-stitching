name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build documentation (runs on push, PR, and manual trigger)
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website (all locales)
        run: npm run build
        env:
          # Ensure all locales are built
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Verify build output
        run: |
          echo "📦 Build output structure:"
          ls -la build/

          # Check English (default) locale
          if [ ! -f "build/index.html" ]; then
            echo "❌ Build failed: index.html not found"
            exit 1
          fi
          echo "✅ English locale: OK"

          # Check zh-TW locale
          if [ -d "build/zh-TW" ]; then
            if [ ! -f "build/zh-TW/index.html" ]; then
              echo "⚠️ zh-TW locale folder exists but index.html missing"
            else
              echo "✅ zh-TW locale: OK"
            fi
          else
            echo "ℹ️ zh-TW locale not built (may need i18n setup)"
          fi

          echo "📊 Build size:"
          du -sh build/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  # Deploy to GitHub Pages (only on main branch push)
  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "### 🚀 Documentation Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Documentation is now available at:" >> $GITHUB_STEP_SUMMARY
          echo "- **English**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **繁體中文**: ${{ steps.deployment.outputs.page_url }}zh-TW/" >> $GITHUB_STEP_SUMMARY
