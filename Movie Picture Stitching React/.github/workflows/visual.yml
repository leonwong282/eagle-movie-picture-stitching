name: Visual Regression

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'package.json'

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    name: Visual Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run visual tests
        run: npm run test:visual

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff-${{ github.sha }}
          path: |
            e2e/**/*-diff.png
            e2e/**/*-actual.png
            playwright-report/
          retention-days: 7

      - name: Comment on PR with diff
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Find diff images
            const findDiffs = (dir, files = []) => {
              if (!fs.existsSync(dir)) return files;
              fs.readdirSync(dir).forEach(file => {
                const fullPath = path.join(dir, file);
                if (fs.statSync(fullPath).isDirectory()) {
                  findDiffs(fullPath, files);
                } else if (file.endsWith('-diff.png')) {
                  files.push(file.replace('-diff.png', ''));
                }
              });
              return files;
            };

            const diffs = findDiffs('e2e');

            if (diffs.length > 0) {
              const body = `## ⚠️ Visual Regression Detected
              
              The following visual tests failed:
              ${diffs.map(d => `- \`${d}\``).join('\n')}
              
              Please review the visual differences in the [workflow artifacts](${context.payload.repository.html_url}/actions/runs/${context.runId}).
              
              If these changes are intentional, update the snapshots by:
              1. Running \`npm run test:visual -- --update-snapshots\` locally
              2. Or pushing to the \`update-snapshots\` branch
              `;
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
