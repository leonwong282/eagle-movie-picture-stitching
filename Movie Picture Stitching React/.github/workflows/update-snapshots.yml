name: Update Visual Snapshots

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for updating snapshots'
        required: false
        default: 'Manual update'
  push:
    branches:
      - 'update-snapshots'
      - 'update-snapshots/**'

permissions:
  contents: write

jobs:
  update:
    name: Update Snapshots
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Update visual snapshots
        run: npm run test:visual -- --update-snapshots

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet e2e/**/*.png 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "📷 No snapshot changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📷 Snapshot changes detected:"
            git diff --stat e2e/**/*.png
          fi

      - name: Commit updated snapshots
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add -A 'e2e/**/*.png'

          REASON="${{ github.event.inputs.reason || 'Automated update' }}"
          git commit -m "chore: update visual snapshots

          Reason: ${REASON}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push

      - name: Summary
        run: |
          if [ "${{ steps.changes.outputs.changed }}" == "true" ]; then
            echo "### ✅ Visual snapshots updated" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Changes have been committed and pushed to this branch." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ℹ️ No changes needed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Visual snapshots are already up to date." >> $GITHUB_STEP_SUMMARY
          fi
